name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Check publish contents
        shell: pwsh
        run: ./scripts/check-publish.ps1
      - name: Build and run offline self-check
        shell: pwsh
        run: ./build.ps1 -SelfTest
      - name: Check demo credential isolation
        shell: pwsh
        run: ./scripts/check-demo.ps1
      - name: Check launcher without starting resident
        shell: pwsh
        run: ./scripts/launch.ps1 -CheckOnly
